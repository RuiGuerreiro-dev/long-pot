let tableGroup = null, clothTex = null;
function clothTexture() {
  const BX = table.HL + table.CW, BY = table.HW + table.CW, TW = CHEAP ? 1024 : renderer.capabilities.maxTextureSize >= 4096 ? 4096 : 2048, TH = TW / 2;
  return canvasTexture(TW, TH, (g, w, h) => {
    const px = x => (x + BX) / (2 * BX) * w, py = y => (BY - y) / (2 * BY) * h, s = w / (2 * BX);
    g.fillStyle = '#1b7a3c'; g.fillRect(0, 0, w, h);
    const grad = g.createRadialGradient(w / 2, h / 2, h * 0.1, w / 2, h / 2, w * 0.6); // the light's pool on the cloth
    grad.addColorStop(0, 'rgba(255,240,200,0.05)'); grad.addColorStop(1, 'rgba(0,0,0,0.08)');
    g.fillStyle = grad; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 14; i++) { // a faint, broad mottle, as real cloth has
      const mx = trand() * w, my = trand() * h, mr = h * (0.2 + trand() * 0.4), mg = g.createRadialGradient(mx, my, 0, mx, my, mr);
      mg.addColorStop(0, trand() < 0.5 ? 'rgba(0,40,15,0.035)' : 'rgba(140,220,160,0.025)'); mg.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = mg; g.fillRect(0, 0, w, h);
    }
    const fibres = Math.round(w * h * 0.012), fl = w / 2048; // the nap: fine fibres along the table, kept quiet
    for (let i = 0; i < fibres; i++) {
      const x = trand() * w, y = trand() * h;
      g.fillStyle = trand() < 0.5 ? 'rgba(0,30,10,0.045)' : 'rgba(150,220,165,0.03)';
      g.fillRect(x, y, fl * (1 + trand() * 2), fl);
    }
    g.strokeStyle = 'rgba(245,245,235,0.78)'; g.lineWidth = Math.max(1.5, 0.003 * s);
    g.beginPath(); g.moveTo(px(LP.BAULK_X), py(table.HW)); g.lineTo(px(LP.BAULK_X), py(-table.HW)); g.stroke(); // baulk line
    g.beginPath(); g.arc(px(LP.BAULK_X), py(0), LP.D_R * s, Math.PI / 2, -Math.PI / 2); g.stroke(); // the D
    g.fillStyle = 'rgba(245,245,235,0.85)';
    for (const c of LP.COLOURS) { const [x, y] = LP.SPOT[c]; g.beginPath(); g.arc(px(x), py(y), 0.004 * s, 0, Math.PI * 2); g.fill(); }
    g.fillStyle = '#020202';
    for (const P of table.pocketList) { g.beginPath(); g.arc(px(P.cx), py(P.cy), P.holeR * s * 1.02, 0, Math.PI * 2); g.fill(); }
  });
}
function rebuildTable() {

  if (clothTex) clothTex.dispose();
  tableGroup = new THREE.Group();
  const HL = table.HL, HW = table.HW, CW = table.CW, RW = LP.SPEC.RAIL_W;
  clothTex = clothTexture();
  const clothMat = new THREE.MeshStandardMaterial({ map: clothTex, roughness: 0.93, envMapIntensity: 0.03 });
  const bed = new THREE.Mesh(new THREE.PlaneGeometry(2 * (HL + CW), 2 * (HW + CW)), clothMat);
  bed.rotation.x = -Math.PI / 2; bed.receiveShadow = true; tableGroup.add(bed);
  // cushions: each piece's outline from the physics, extruded to the cushion's height
  const cushionMat = new THREE.MeshStandardMaterial({ color: 0x176b34, roughness: 0.9, envMapIntensity: 0.03 });
  for (const pc of table.pieces) {
    const sh = new THREE.Shape(pc.poly.map(([x, y]) => new THREE.Vector2(x, y)));
    const g = new THREE.ExtrudeGeometry(sh, { depth: 0.042, bevelEnabled: false, curveSegments: 12 });

  const rail = new THREE.Shape([new THREE.Vector2(-OX, -OY), new THREE.Vector2(OX, -OY), new THREE.Vector2(OX, OY), new THREE.Vector2(-OX, OY)]);
  rail.holes.push(new THREE.Path(table.railHole.map(([x, y]) => new THREE.Vector2(x, y))));
  const railG = new THREE.ExtrudeGeometry(rail, { depth: 0.2, bevelEnabled: true, bevelThickness: 0.008, bevelSize: 0.008, bevelSegments: 4, curveSegments: 12 });
  const railM = new THREE.Mesh(railG, woodMat); railM.rotation.x = -Math.PI / 2; railM.position.y = -0.155; railM.castShadow = !CHEAP; railM.receiveShadow = true;
  tableGroup.add(railM);

    cup.position.copy(V3(P.cx, P.cy, -0.08)); tableGroup.add(cup);
    let [a0, d] = P.arc; if (d < 0) { a0 += d; d = -d; }
    const rim = new THREE.Mesh(new THREE.TorusGeometry(P.holeR + 0.006, 0.011, 12, 48, d), leatherMat);

    rim.castShadow = !CHEAP; tableGroup.add(rim);

  const body = new THREE.Mesh(new THREE.BoxGeometry(2 * OX - 0.06, 0.22, 2 * OY - 0.06), woodMat);
  body.position.y = -0.27; tableGroup.add(body);
  for (const fx of [-0.93, -0.31, 0.31, 0.93]) for (const s of [-1, 1]) {
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.06, 0.48, CHEAP ? 10 : 20), woodMat);
    leg.position.set(fx * HL, -0.62, s * (HW + 0.02)); leg.castShadow = !CHEAP; tableGroup.add(leg);
    const foot = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.095, 0.05, CHEAP ? 10 : 20), woodMat);
    foot.position.set(fx * HL, -0.835, s * (HW + 0.02)); tableGroup.add(foot);
  }

}
rebuildTable();

// The hall: floor, tiers of empty seats in the dark, and the canopy over the table.
const canopy = {};
(function buildHall() {

  ];

// ---- Camera: behind the cue ball to aim, overhead on V, free orbit on right-drag -------------
const cam = { mode: 'title', yaw: 0, pitch: 0.4, dist: 3, tx: 0, ty: 0, th: 0, // current
  yawOff: 0, pitchOff: 0, zoom: 1, topZoom: 1, preferTop: false, free: null, last: 0 };
function camWant() {
  const t = state ? state.t : 0;
  if (scene === 'title' || scene === 'levels') return { yaw: -0.6 + t * 0.04, pitch: 0.42, dist: 3.6, tx: 0.2, ty: 0, th: 0 };
  if (cam.free) return cam.free;
  if (cam.mode === 'top') return { yaw: Math.PI / 2, pitch: 1.5605, dist: 3.25 * cam.topZoom, tx: 0, ty: 0, th: 0 };
  if (cam.mode === 'watch') {
    let sx = 0, sy = 0, n = 0;
    for (let i = 0; i < LP.N; i++) if (sim.on[i] && sim.mov[i]) { sx += sim.x[i]; sy += sim.y[i]; n++; }
    if (!n) { sx = sim.x[0]; sy = sim.y[0]; n = 1; }
    return { yaw: state.shotAng, pitch: 0.62, dist: 2.1 * cam.zoom, tx: sx / n * 0.7, ty: sy / n * 0.7, th: 0 };
  }
  // aim
  const a = state.aim + cam.yawOff;
  return { yaw: a, pitch: tune.cam_pitch * Math.PI / 180 + cam.pitchOff, dist: tune.cam_dist * cam.zoom,
    tx: sim.x[0] + Math.cos(state.aim) * 0.18, ty: sim.y[0] + Math.sin(state.aim) * 0.18, th: R };
}
function angLerp(a, b, k) { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return a + d * k; }

  const w = camWant(), k = snap ? 1 : 1 - Math.exp(-tune.cam_follow * dt);
  cam.yaw = angLerp(cam.yaw, w.yaw, k); cam.pitch += (w.pitch - cam.pitch) * k; cam.dist += (w.dist - cam.dist) * k;
  cam.tx += (w.tx - cam.tx) * k; cam.ty += (w.ty - cam.ty) * k; cam.th += (w.th - cam.th) * k;
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  const target = V3(cam.tx, cam.ty, cam.th);
  const pos = V3(cam.tx - Math.cos(cam.yaw) * cp * cam.dist, cam.ty - Math.sin(cam.yaw) * cp * cam.dist, cam.th + sp * cam.dist);
  camera.position.copy(pos);
  if (cam.pitch > 1.3) camera.up.set(Math.cos(cam.yaw), 0, -Math.sin(cam.yaw)); else camera.up.set(0, 1, 0);
  camera.lookAt(target);
}
function cameraOrbitStart() {
  if (scene !== 'play') return;
  if (cam.mode !== 'aim' || !state.human || state.phase !== 'aim') cam.free = { yaw: cam.yaw, pitch: Math.min(cam.pitch, 1.45), dist: cam.dist, tx: cam.tx, ty: cam.ty, th: cam.th };
}
function cameraOrbit(dx, dy) {
  if (scene !== 'play') return;
  if (cam.free) { cam.free.yaw -= dx * 0.006; cam.free.pitch = Math.max(0.05, Math.min(1.5, cam.free.pitch + dy * 0.004)); }
  else { cam.yawOff -= dx * 0.006; cam.pitchOff = Math.max(-0.15, Math.min(1.2, cam.pitchOff + dy * 0.004)); }
}
function cameraOrbitEnd() {}
function cameraZoom(dy) {
  const f = Math.exp(dy * 0.001);
  if (cam.free) cam.free.dist = Math.max(0.3, Math.min(6, cam.free.dist * f));
  else if (cam.mode === 'top') cam.topZoom = Math.max(0.35, Math.min(1.6, cam.topZoom * f));
  else cam.zoom = Math.max(0.35, Math.min(4, cam.zoom * f));
}
function camForTurn() { cam.free = null; cam.yawOff = 0; cam.pitchOff = 0; cam.mode = cam.preferTop ? 'top' : 'aim'; }

// ---- Scenes: keep only the day-one screens the brief calls for ----------------------------
let scene, state;
const quats = []; for (let i = 0; i < LP.N; i++) quats.push(new THREE.Quaternion());
let menu = { item: 0, diff: 2, level: 0 };
function loadStars() { try { const s = JSON.parse(localStorage.getItem('long-pot-stars') || '[]'); return Array.isArray(s) ? s : []; } catch (_) { return []; } }
function saveStars(a) { try { localStorage.setItem('long-pot-stars', JSON.stringify(a)); } catch (_) { /* private mode */ } }
let stars = loadStars();
const unlocked = i => i === 0 || (stars[i - 1] || 0) > 0;

function reset() {
  seed = Number(params.get('seed')) || CONFIG.seed;
  // state.gained: what this run gained or learned, the high the ending shows.
  state = { t: 0, score: 0, gained: '', mode: 'title', phase: 'none', human: false, aim: 0, tipA: 0, tipB: 0, power: 0, pull: 0,
    msg: '', msgT: 0, shots: 0, pots: 0, help: false, guide: 'ghost', shotAng: 0, scores: [0, 0], brk: 0, ballOn: 'Red', player: 0, goal: false };
  LP.rack(sim); sim.place(0, LP.BAULK_X - 0.08, 0.1);
  for (const q of quats) q.identity();
}
function say(s, t = 2.6) { state.msg = s; state.msgT = t; events.push({ msg: s }); }
function mirror() { // the frame into state, so window.game.state reports it
  if (!frame) return;
  state.scores = frame.scores.slice(); state.brk = frame.brk; state.ballOn = frame.onText(); state.player = frame.player;
  state.score = state.mode === 'frame' ? frame.scores[0] : state.pots;
}

function startLevel(i) {
  reset();
  const def = CONFIG.levels[i];
  sim.setParams(physParams());
  const lay = LP.setupLevel(sim, def, table);
  frame = new LP.Frame(true);
  frame.startPhase(sim); frame.inHand = def.cue === 'D';
  Object.assign(state, { mode: 'training', level: i, def, zone: lay.zone, placed: lay.placed, guide: def.guide, shots: 0, pots: 0, human: true, goal: false, failed: '' });
  scene = 'play';
  beginTurn(true);
  say(TOUCH && def.hint_touch ? def.hint_touch : def.hint, 7);
}
function startFrame(diff, breaker = 0) { // breaker: 0 you, 1 the computer
  reset();
  sim.setParams(physParams());
  LP.rack(sim); sim.place(0, LP.BAULK_X - 0.06, 0.12);
  frame = new LP.Frame(false);
  frame.startPhase(sim); frame.inHand = true; frame.player = breaker;
  Object.assign(state, { mode: 'frame', aiLevel: LP.LEVELS[diff], aiName: LP.LEVEL_NAME[LP.LEVELS[diff]], guide: 'ghost', zone: null, breaker });
  scene = 'play';
  beginTurn(true);
  say(breaker ? 'The computer breaks.' : TOUCH ? 'You break. Drag the cue ball into the D, then Place.' : 'You break. Place the cue ball in the D, then Enter.', 4);
}

function legalAimTarget() { // the nearest ball on, to point the cue at when a turn starts
  const tg = frame.targets(sim); let best = -1, bd = 1e9;
  for (const t of tg) { const d = Math.hypot(sim.x[t] - sim.x[0], sim.y[t] - sim.y[0]); if (d < bd) { bd = d; best = t; } }
  return best;
}
function pointAtNearest() {
  const t = legalAimTarget();
  if (t >= 0) state.aim = Math.atan2(sim.y[t] - sim.y[0], sim.x[t] - sim.x[0]);
}
function beginTurn(first) {

let lastDraw = 0;
function render3D() {

  for (const L of canopyLights) L.intensity = tune.light_intensity;
  const figures = scene === 'figures';
  if (!figures) {
    for (let i = 0; i < LP.N; i++) {
      const b = balls[i], d = drops.find(o => o.i === i);
      if (sim.on[i]) {
        b.mesh.visible = true; b.shadow.visible = true;
        b.mesh.position.copy(V3(sim.x[i], sim.y[i], R)); b.mesh.quaternion.copy(quats[i]);
        b.shadow.position.copy(V3(sim.x[i], sim.y[i], 0.0008));

        b.mesh.visible = true; b.shadow.visible = false;

}

      cards.forEach(([ic, t, sub], i) => {
        const cw = 330, ch = 156, x = W / 2 - cw - 12 + i * (cw + 24), y = 222, hot = menu.item === i || hovering(x, y, cw, ch);
        glass(x, y, cw, ch, 22, hot);
        ctx.beginPath(); ctx.arc(x + 44, y + 46, 22, 0, Math.PI * 2); ctx.fillStyle = hot ? 'rgba(242,201,76,0.18)' : 'rgba(255,255,255,0.07)'; ctx.fill();
        icon(ic, x + 44, y + 46, 11, hot ? UI.gold : UI.text);
        text(t, x + 80, y + 47, 23, UI.text, 'left', FONT, '700');
        wrapLines(sub, cw - 48, 15).forEach((l, k) => text(l, x + 24, y + 94 + k * 21, 15, UI.dim, 'left', FONT, '500'));
        hudHits.push({ x, y, w: cw, h: ch, fn: () => { menu.item = i; sfx('ui'); if (i === 0) { scene = 'levels'; menu.level = firstOpenLevel(); } else startFrame(menu.diff); } });
      });
      // difficulty: a segmented control under the cards
      const sw = 120, sx = W / 2 - 2 * sw, sy = 402, shh = 44;
      caps('Computer difficulty', W / 2, sy - 14, 12, UI.dim, 'center', 1.8);
      glass(sx - 4, sy, 4 * sw + 8, shh + 8, (shh + 8) / 2);
      LP.LEVELS.forEach((lv, i) => {
        const x = sx + i * sw, y = sy + 4, on = menu.diff === i, hot = hovering(x, y, sw, shh);
        if (on) { const gg = ctx.createLinearGradient(0, y, 0, y + shh); gg.addColorStop(0, UI.gold); gg.addColorStop(1, UI.goldDeep); rrect(x, y, sw, shh, shh / 2); ctx.fillStyle = gg; ctx.fill(); }
        else if (hot) { rrect(x, y, sw, shh, shh / 2); ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fill(); }
        text(LP.LEVEL_NAME[lv], x + sw / 2, y + shh / 2 + 1, 15, on ? '#1c1606' : UI.text, 'center', FONT, '600');
        hudHits.push({ x, y, w: sw, h: shh, fn: () => { menu.diff = i; menu.item = 1; sfx('ui'); } });
      });
      CONTROLS.forEach((c, i) => text(c, W / 2, 506 + i * 24, 14, UI.dim, 'center', FONT, '500'));
      caps(TOUCH ? 'Tap to choose' : 'Left / Right: mode  ·  Up / Down: difficulty  ·  Enter, or click', W / 2, H - 26, 11, UI.faint, 'center', 2);
    },
  },
  levels: {
    update(dt) {
      state.t += dt;
      const L = menu.level;
      if (pressed('ArrowRight')) menu.level = Math.min(7, L + 1);
      if (pressed('ArrowLeft')) menu.level = Math.max(0, L - 1);
      if (pressed('ArrowDown')) menu.level = Math.min(7, L + 4);
      if (pressed('ArrowUp')) menu.level = Math.max(0, L - 4);
      if (menu.level !== L) sfx('ui');
      if (pressed('Escape') || pressed('Backspace')) { scene = 'title'; return; }
      if ((pressed('Enter') || pressed('Space')) && unlocked(menu.level)) { sfx('ui'); startLevel(menu.level); }
    },
    draw() {
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, W, H);
      caps('Training', W / 2, 64, 40, '#f7f3ea', 'center', 8, '800');
      text('Each level teaches one skill. Clear one to open the next.', W / 2, 106, 16, UI.dim, 'center', FONT, '500');
      CONFIG.levels.forEach((def, i) => {
        const cw = 268, ch = 176, x = W / 2 - 2 * cw - 30 + (i % 4) * (cw + 20), y = 140 + Math.floor(i / 4) * (ch + 20);
        const open = unlocked(i), hot = menu.level === i || hovering(x, y, cw, ch);
        glass(x, y, cw, ch, 20, hot && open);
        text(String(i + 1).padStart(2, '0'), x + 22, y + 34, 30, open ? UI.gold : UI.faint, 'left', FONT, '800');
        text(def.name, x + 22, y + 70, 19, open ? UI.text : UI.faint, 'left', FONT, '700');
        wrapLines(def.skill, cw - 44, 14).forEach((l, k) => text(l, x + 22, y + 96 + k * 19, 14, open ? UI.dim : UI.faint, 'left', FONT, '500'));
        if (open) for (let s = 0; s < 3; s++) star(x + 34 + s * 30, y + ch - 26, 10, (stars[i] || 0) > s);
        else icon('lock', x + cw - 34, y + 34, 11, UI.faint);
        hudHits.push({ x, y, w: cw, h: ch, fn: () => { menu.level = i; if (open) { sfx('ui'); startLevel(i); } } });
      });
      button('Back', 40, H - 74, 150, 46, () => { scene = 'title'; }, { icon: 'back', key: 'Esc' });
      caps(TOUCH ? 'Tap a level' : 'Arrows and Enter, or click a level', W / 2, H - 50, 11, UI.faint, 'center', 2);
    },
  },
  play: {
    update(dt) {
      if (pressed('KeyP') || pressed('Escape')) { scene = 'pause'; return; }
      state.t += dt; state.phaseT = (state.phaseT || 0) + dt;
      if (state.msgT > 0) state.msgT -= dt;
      if (pressed('KeyH')) state.help = !state.help;
      if (pressed('KeyV')) toggleView();
      if (pressed('KeyG') && state.mode === 'frame') cycleGuide();
      if (pressed('KeyR') && state.mode === 'training') { startLevel(state.level); return; }
      const ph = state.phase;
      if (ph === 'place') {
        const k = 0.25 * dt;
        let dx = 0, dy = 0;
        // the overhead view: right is toward the black end, up is the table's left side
        if (down.has('ArrowRight')) dx += k; if (down.has('ArrowLeft')) dx -= k; if (down.has('ArrowUp')) dy += k; if (down.has('ArrowDown')) dy -= k;
        if (dx || dy) placeCueFree(sim.x[0] + dx, sim.y[0] + dy);
        spinKeys();
        if (pressed('Enter') || pressed('Space')) confirmPlace();
      } else if (ph === 'aim' && state.human) {
        const turn = tune.aim_key_speed * Math.PI / 180 * dt * (shiftHeld() ? tune.aim_fine : 1);
        if (down.has('ArrowLeft')) state.aim += turn;
        if (down.has('ArrowRight')) state.aim -= turn;
        spinKeys();
        if (down.has('Space')) { state.spaceHeld = true; state.keyPower = Math.min(1, state.keyPower + dt / tune.key_power_time); state.power = state.keyPower; state.pull = state.keyPower; }
        else if (state.spaceHeld) { state.spaceHeld = false; const p = state.keyPower; state.keyPower = 0; beginStrike(p); }
      } else if (ph === 'strike') {
        if (state.phaseT >= 0.07) strikeNow(state.pending);
      } else if (ph === 'roll') {
        const n = Math.max(1, Math.round(tune.physics_substeps)), h = STEP / n;
        for (let s = 0; s < n; s++) sim.step(h);
        spinBalls();
        if (!sim.anyMoving()) judgeShot();
      } else if (ph === 'judge') {
        if (state.phaseT >= tune.judge_pause) afterJudge();
      } else if (ph === 'choice') {
        if (pressed('Digit1') || pressed('Numpad1')) choose(true);
        else if (pressed('Digit2') || pressed('Numpad2')) choose(false);
      } else if (ph === 'aiThink') {
        let done = false;
        for (let k = 0; k < tune.ai_sims_per_step; k++) { const r = aiJob.gen.next(); if (r.done) { done = true; break; } }
        if (aiJob.result && !done) done = true;
        if (done && state.phaseT >= tune.ai_think_min) {
          const res = aiJob.result;
          if (res.place) { sim.place(0, res.place[0], res.place[1]); frame.inHand = false; }
          state.aiFrom = state.aim; state.aiTo = res.intendedAng; state.tipA = res.a; state.tipB = res.b;
          state.phase = 'aiAddress'; state.phaseT = 0; state.aiPull = 0.05;
          cam.mode = 'aim'; cam.pitchOff = 0.1;
        }
      } else if (ph === 'aiAddress') {
        const t = state.phaseT, res = aiJob.result;
        const k = Math.min(1, t / 0.6), e = k * k * (3 - 2 * k);
        state.aim = angLerp(state.aiFrom, state.aiTo, e);
        const pw = Math.min(1, Math.pow(Math.max(0, (res.V0 - tune.cue_speed_min) / (tune.cue_speed_max - tune.cue_speed_min)), 1 / tune.power_curve));
        state.power = pw;
        if (t < 0.6) state.aiPull = 0.05;
        else if (t < 1.15) state.aiPull = 0.05 + (pw * 0.8 + 0.1) * Math.sin((t - 0.6) / 0.55 * Math.PI / 2);
        else state.aiPull = Math.max(0, (pw * 0.8 + 0.15) * (1 - (t - 1.15) / 0.07));
        if (t >= 1.22) { state.aim = res.ang; strikeNow({ ang: res.ang, V0: res.V0, a: res.a, b: res.b }); }
      }
      mirror();
    },
    draw() { ctx.clearRect(0, 0, W, H); drawPlayHUD(); },
  },
  pause: {
    update() {
      if (pressed('KeyP') || pressed('Escape')) scene = 'play';
      else if (pressed('KeyR') && state.mode === 'training') startLevel(state.level);
      else if (pressed('KeyK') && state.mode === 'frame') concede();
      else if (pressed('KeyQ')) titleBack();
    },
    draw() {
      scenes.play.draw(); hudHits = [];
      const [x, y] = modal(420, 366), bx = x + 40, bw = 340;
      text('Paused', W / 2, y + 48, 30, UI.text, 'center', FONT, '800');
      button('Resume', bx, y + 86, bw, 50, () => { scene = 'play'; }, { primary: true, icon: 'play', key: 'P' });
      if (state.mode === 'training') button('Restart the level', bx, y + 148, bw, 50, () => startLevel(state.level), { icon: 'restart', key: 'R' });
      else button('Concede the frame', bx, y + 148, bw, 50, concede, { icon: 'flag', key: 'K' });
      button('Quit to the menu', bx, y + 210, bw, 50, titleBack, { icon: 'exit', key: 'Q' });
      button(muted ? 'Sound off' : 'Sound on', bx, y + 272, bw, 50, () => setMuted(!muted), { icon: muted ? 'soundOff' : 'soundOn', key: 'M' });
    },
  },
  over: { // a training level failed: straight back in
    update() {
      if (pressed('KeyR') || pressed('Enter') || pressed('Space')) startLevel(state.level);
      else if (pressed('KeyL') || pressed('Escape')) toLevels();
    },
    draw() {
      scenes.play.draw(); hudHits = [];
      const [x, y] = modal(600, 250);
      caps(`Level ${state.level + 1}`, W / 2, y + 36, 12, UI.gold, 'center', 2);
      text('Not this time', W / 2, y + 72, 32, UI.text, 'center', FONT, '800');
      wrapLines(state.gained || 'Try again', 520, 16, '500').forEach((l, k) => text(l, W / 2, y + 112 + k * 22, 16, UI.dim, 'center', FONT, '500'));
      button('Try again', x + 40, y + 168, 250, 50, () => startLevel(state.level), { primary: true, icon: 'restart', key: 'R' });
      button('Levels', x + 310, y + 168, 250, 50, toLevels, { icon: 'grid', key: 'L' });
    },
  },
  results: {
    update() {
      if (state.mode === 'training') {
        if (pressed('Enter') || pressed('Space')) { if (state.level < 7) startLevel(state.level + 1); else { scene = 'levels'; menu.level = 7; } }
        else if (pressed('KeyR')) startLevel(state.level);
        else if (pressed('KeyL') || pressed('Escape')) toLevels();
      } else if (pressed('Enter') || pressed('Space')) titleBack();
      else if (pressed('KeyR')) startFrame(LP.LEVELS.indexOf(state.aiLevel), 1 - (state.breaker || 0)); // the break alternates
    },
    draw() {
      scenes.play.draw(); hudHits = [];
      const [x, y] = modal(660, 300);
      if (state.mode === 'training') {
        caps(state.def.name, W / 2, y + 38, 12, UI.gold, 'center', 2);
        text(state.gained, W / 2, y + 76, 32, UI.text, 'center', FONT, '800');
        for (let s = 0; s < 3; s++) star(W / 2 - 64 + s * 64, y + 136, 24, state.stars > s);
        const sub = state.def.goal.type === 'break' ? `A break of ${state.finalBreak}` : `${state.shots} ${state.shots === 1 ? 'shot' : 'shots'}`;
        text(sub, W / 2, y + 186, 16, UI.dim, 'center', FONT, '500');
        const nextFn = () => { if (state.level < 7) startLevel(state.level + 1); else { scene = 'levels'; menu.level = 7; } };
        button(state.level < 7 ? 'Next level' : 'Levels', x + 36, y + 222, 200, 50, nextFn, { primary: true, icon: 'next', key: 'Enter' });
        button('Replay', x + 252, y + 222, 180, 50, () => startLevel(state.level), { icon: 'restart', key: 'R' });
        button('Levels', x + 448, y + 222, 176, 50, toLevels, { icon: 'grid', key: 'L' });
      } else {
        caps(`Against the computer · ${state.aiName}`, W / 2, y + 38, 12, UI.gold, 'center', 2);
        text(state.gained, W / 2, y + 76, 30, UI.text, 'center', FONT, '800');
        text(`${frame.scores[0]}  –  ${frame.scores[1]}`, W / 2, y + 132, 48, UI.text, 'center', FONT, '800');
        text(`Highest break: you ${Math.max(frame.high[0], frame.player === 0 ? frame.brk : 0)} · computer ${Math.max(frame.high[1], frame.player === 1 ? frame.brk : 0)}`, W / 2, y + 180, 15, UI.dim, 'center', FONT, '500');
        button('Menu', x + 110, y + 222, 200, 50, titleBack, { icon: 'exit', key: 'Enter' });
        button('Play again', x + 350, y + 222, 200, 50, () => startFrame(LP.LEVELS.indexOf(state.aiLevel), 1 - (state.breaker || 0)), { primary: true, icon: 'restart', key: 'R' });
      }
    },
  },
};
function firstOpenLevel() { for (let i = 0; i < 8; i++) if (!(stars[i] > 0)) return unlocked(i) ? i : 0; return 0; }
function spinKeys() {
  const st = tune.spin_key_step, lim = tune.tip_max;
  if (pressed('KeyW')) state.tipB += st; if (pressed('KeyS')) state.tipB -= st;
  if (pressed('KeyD')) state.tipA += st; if (pressed('KeyA')) state.tipA -= st;
  if (pressed('KeyC')) { state.tipA = 0; state.tipB = 0; }
  const m = Math.hypot(state.tipA, state.tipB); if (m > lim) { state.tipA *= lim / m; state.tipB *= lim / m; }
}
const _q = new THREE.Quaternion(), _ax = new THREE.Vector3();
function spinBalls() { // turn each ball's mesh by its spin over the step, so the cue ball's spots show it
  for (let i = 0; i < LP.N; i++) {
    if (!sim.on[i] || !sim.mov[i]) continue;
    _ax.set(sim.wx[i], sim.wz[i], -sim.wy[i]);
    const w = _ax.length(); if (w < 1e-6) continue;
    _q.setFromAxisAngle(_ax.multiplyScalar(1 / w), w * STEP); quats[i].premultiply(_q);
  }
}

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  soundsThisStep = 0;
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  if (!(upright() && scene === 'play')) scenes[scene].update(STEP); // held upright, the game waits
  hit.clear();
}
let last, acc = 0, ALPHA = 1; // ALPHA: how far the frame is between the last two steps
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now; // a stall never fast-forwards the game
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP; // draw between steps, so the view never judders
  drawFrame();
}
const upright = () => TOUCH && innerHeight > innerWidth;
function drawFrame() { hudHits = []; render3D(); scenes[scene].draw(); if (upright()) drawRotate(); }
function frameLoop() { tick(); requestAnimationFrame(frameLoop); }
// A headless browser on a time budget runs timers but almost no animation frames: a timer
// ticks when no frame has come for 100 ms on a visible page; a hidden tab stays paused.
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; }, // the loop steps; a check empties it
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
if (scene === 'play') {
  if (params.get('frame')) startFrame(Math.max(0, Math.min(3, Number(params.get('frame')) - 1)), params.get('first') === 'computer' ? 1 : 0);
  else startLevel(Math.max(0, Math.min(7, (Number(params.get('level')) || 1) - 1)));
}
updateCamera(0, true);
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frameLoop); setInterval(timer, 50); }
</script>
